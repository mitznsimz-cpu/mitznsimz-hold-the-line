<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hold the Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Grenze+Gotisch:wght@600;800&display=swap">
<style>
/* the page runs edge to edge on phones: keep clear of the notch and the home bar */
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one-screen game. Header, HUD with initiative track, battle mat canvas (fills the space), hero tray.
   Look: a walnut gaming table at night, a vinyl battle mat, unpainted minis; MitzNSimz red and gold for anything you touch. */
:root{
  --table:#1c130f; --table-2:#261a14; --panel:#2a1d16; --panel-2:#36261c; --line:#4b392b;
  --ink:#f1e7d2; --ink-dim:#b8a78a; --red:#a3202a; --red-hi:#c9353e; --gold:#d4a537; --gold-hi:#f0cd6e;
  --display:'Grenze Gotisch', Georgia, 'Times New Roman', serif;
  --ui:'Barlow Semi Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
html{height:100%;box-sizing:border-box}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{
  height:100%;margin:0;overflow:hidden;background-color:var(--table);color:var(--ink);font-family:var(--ui);font-size:15px;
  background-image:repeating-linear-gradient(0deg, rgba(255,240,220,.018) 0 1px, transparent 1px 7px);
  -webkit-tap-highlight-color:transparent;
}
.app{height:100%;max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-inline:16px;padding-block:10px 12px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font:600 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font:800 30px/.95 var(--display);color:var(--ink);text-wrap:balance}
.controls{display:flex;gap:6px}
button{font-family:var(--ui)}
.ctl{
  font:600 13px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 11px;min-height:34px;cursor:pointer;
}
.ctl:hover{background:var(--panel-2)}
.ctl[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#22160f}
button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.hud{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;padding:6px 12px;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
}
.stat{display:flex;align-items:center;gap:6px;white-space:nowrap}
.lbl{font:600 11px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.stat b{font:700 19px/1 var(--ui);font-variant-numeric:tabular-nums lining-nums}
.coin{
  display:inline-block;width:16px;height:16px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 32%, var(--gold-hi), var(--gold) 55%, #7d5b12);
  box-shadow:inset 0 0 0 1.5px #7d5b12;
}
#purse.pulse b{animation:pulse .32s ease-out}
@keyframes pulse{0%{color:var(--gold-hi);transform:scale(1.18)}100%{color:var(--ink);transform:scale(1)}}
.pips{display:flex;gap:3px}
.pip{width:9px;height:13px;border-radius:5px 5px 2px 2px;background:var(--red-hi);box-shadow:inset 0 0 0 1px #5a1016}
.pip.lost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.track{flex:1 1 150px;min-width:140px;height:28px;display:block}
.board{position:relative;flex:1 1 auto;min-height:0;border-radius:8px;overflow:hidden}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.tray{display:grid;grid-template-columns:repeat(var(--n,7),minmax(0,1fr));gap:6px}
.card{
  position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;align-items:center;column-gap:6px;
  min-width:0;padding:6px 8px 7px 4px;text-align:left;cursor:pointer;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
}
.card canvas{grid-row:1 / span 2;width:44px;height:44px}
.card .nm{font:700 15px/1.05 var(--ui);letter-spacing:.02em;min-width:0}
.card .meta{display:flex;align-items:center;gap:4px;font:600 13px/1.2 var(--ui);color:var(--gold-hi);font-variant-numeric:tabular-nums lining-nums;min-width:0}
.card .meta .coin{width:11px;height:11px}
.card .role{display:none} /* seven heroes leave no room for it: the role is in the label and the tap-for-info hint */
.card:hover:not(:disabled){background:var(--panel-2)}
.card[aria-pressed="true"]{background:var(--panel-2);border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.card:disabled{opacity:.42;cursor:not-allowed}
.card .key{position:absolute;top:4px;right:6px;font:600 10px/1 var(--ui);color:var(--ink-dim);opacity:.7}
.card.kit{background:var(--table-2)}
.card.kit .nm{font-size:13px}
.card .cool{position:absolute;inset:0;border-radius:inherit;background:rgba(10,6,4,.62);transform-origin:bottom;transform:scaleY(var(--cool,0));pointer-events:none}
@media (max-width:1060px){
  .card{grid-template-columns:1fr;grid-template-rows:auto auto auto;justify-items:center;text-align:center;padding:5px 2px 6px;row-gap:1px}
  .card canvas{grid-row:auto;width:38px;height:38px}
  .card .role{display:none}
}
.overlay{
  position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;overflow:auto;
  padding:calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  background:rgba(14,9,7,.7);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.panel{
  width:100%;max-width:440px;margin:auto;padding:22px 22px 20px;border-radius:10px;background:var(--panel);
  box-shadow:0 0 0 1px var(--line), inset 0 0 0 5px var(--panel), inset 0 0 0 6px rgba(212,165,55,.38), 0 18px 40px rgba(0,0,0,.45);
}
.panel h2{margin:6px 0 8px;font:800 44px/.95 var(--display);text-wrap:balance}
.panel .lede{margin:0 0 14px;font:500 17px/1.35 var(--ui);color:var(--ink)}
.how{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:7px}
.how li{position:relative;padding-left:18px;font:500 15px/1.35 var(--ui);color:var(--ink-dim)}
.how li::before{content:"";position:absolute;left:2px;top:.5em;width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.how b{color:var(--ink);font-weight:700}
.panel.wide{max-width:660px}
.cats{display:flex;gap:6px;align-items:center}
.deadly-note{display:none}
.party.fixed{grid-template-columns:repeat(3,minmax(0,1fr))}
.rooms.modes{grid-template-columns:repeat(2,minmax(0,1fr))}
.party.fixed .regular{cursor:default}
.battle.static{cursor:default}
.b-name .solved{font:700 10px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;margin-left:8px;border-radius:999px;background:var(--gold);color:#22160f;vertical-align:2px}
.card .meta .left{font-weight:800;color:var(--gold)}
#tavernLine.deadly .tl-help{text-decoration:line-through;text-decoration-color:rgba(201,53,62,.8);opacity:.6}
#tavernLine.deadly .deadly-note{display:inline;color:var(--ink)}
.pw{display:flex;align-items:center;gap:5px;min-height:30px;padding:0 9px 0 6px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer;font:700 13px var(--ui)}
.pw .paw{width:17px;height:17px;flex:none;fill:#151316;stroke:#8a8392;stroke-width:1}
#pw-pounce .paw{stroke:#c9353e;stroke-width:1.6}#pw-swat .paw{stroke:#d9a93a;stroke-width:1.6} /* Mitz's red collar, Simz's gold */
.pw .pw-cd{font:600 11px var(--ui);color:var(--ink-dim);font-variant-numeric:tabular-nums}
.pw.duty{border-color:var(--gold)}
.pw[aria-pressed="true"]{background:var(--gold);color:#22160f;border-color:var(--gold)}
.pw[aria-pressed="true"] .pw-cd{color:#22160f}
.pw:disabled{opacity:.55;cursor:default}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.item{display:grid;gap:4px;align-content:start;padding:10px 12px 11px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.item.duty{border-color:var(--gold)}
.item b{font:700 15.5px/1.2 var(--ui)}
.item b em{font:700 10px/1 var(--ui);font-style:normal;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;margin-left:6px;border-radius:999px;background:var(--gold);color:#22160f;vertical-align:2px}
.item span{font:500 13.5px/1.3 var(--ui);color:var(--ink-dim)}
.item .item-none{font-size:12.5px}
.item.unmet{opacity:.55;border-style:dashed}
.item b em.have{font:700 11px/1 var(--ui);font-style:normal;padding:3px 7px;margin-left:6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink);vertical-align:2px}
.givers button:disabled{opacity:.5;cursor:default}
.givers{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.givers button{min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-dim);font:700 12.5px var(--ui);cursor:pointer}
.givers button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#22160f}
.hub .persona{margin-bottom:12px}
.takings{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 14px;padding:10px 14px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.takings .lbl{font:600 12px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.takings b{font:700 26px/1 var(--ui);font-variant-numeric:tabular-nums lining-nums;color:var(--gold-hi)}
.coin{display:inline-block;width:.72em;height:.72em;margin-right:.3em;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f6dc8e,#d4a537 55%,#7d5b12);vertical-align:-.04em}
.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 16px}
.room{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px 12px 11px;border-radius:8px;cursor:pointer;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);min-height:112px}
.room:hover:not([disabled]){border-color:var(--gold)}
.room b{font:700 17px/1.15 var(--ui)}
.room span{font:500 13.5px/1.3 var(--ui);color:var(--ink-dim)}
.room em{margin-top:auto;font:700 12px/1 var(--ui);font-style:normal;letter-spacing:.06em;color:var(--gold-hi)}
.room[disabled]{cursor:default;opacity:.55;background:repeating-linear-gradient(-45deg,var(--panel-2) 0 10px,#2f2118 10px 20px)}
.regulars canvas{display:block;width:100%;height:58px;border-radius:6px;margin:0 0 16px}
.stars{margin-left:auto;align-self:center;font:13px/1 var(--ui);letter-spacing:.06em;color:var(--gold-hi);white-space:nowrap}
.stars i{font-style:normal;color:rgba(241,231,210,.22)}
.battle.locked{cursor:default;opacity:.5}
.battle.locked canvas{filter:grayscale(1) brightness(.6)}
.result-stars{display:flex;align-items:center;gap:10px;margin:-2px 0 10px}
.result-stars .stars{margin:0;font-size:30px}
.result-stars span:not(.stars){font:700 11px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--gold);color:#22160f}
.gains{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:6px}
.gains li{position:relative;padding-left:18px;font:500 15px/1.35 var(--ui);color:var(--ink-dim)}
.gains li::before{content:"";position:absolute;left:2px;top:.5em;width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.gains b{color:var(--ink);font-weight:700}
.works{display:grid;gap:8px;margin:0 0 16px}
.work{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.work.shut{opacity:.55}
.work-lab{display:grid;gap:2px;min-width:0;flex:1}
.work-lab b{font:700 17px/1.2 var(--ui)}
.work-lab span{font:500 14px/1.3 var(--ui);color:var(--ink-dim)}
.work-lab .work-next{color:var(--ink)}
.work-lvl .stars{margin:0;font-size:12px}
.buy{flex:none;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--gold);background:var(--gold);color:#22160f;font:700 15px var(--ui);cursor:pointer}
.buy[disabled]{background:transparent;color:var(--ink-dim);border-color:var(--line);cursor:default}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tabs button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);font:700 14px var(--ui);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#22160f}
.trophies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.trophy{display:grid;gap:3px;padding:10px 12px;border-radius:8px;background:var(--panel-2);border:1px dashed var(--line);opacity:.62}
.trophy.got{opacity:1;border:1px solid var(--gold);box-shadow:inset 0 0 0 1px rgba(212,165,55,.25)}
.trophy b{font:700 15.5px/1.2 var(--ui)}
.trophy span{font:500 13.5px/1.3 var(--ui);color:var(--ink-dim)}
.trophy em{font:700 12px/1 var(--ui);font-style:normal;color:var(--gold-hi)}
.beasts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.beast{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 10px 9px 6px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.beast canvas{width:54px;height:54px}
.beast b{display:block;font:700 15.5px/1.2 var(--ui)}
.beast span{display:block;font:500 13px/1.3 var(--ui);color:var(--ink-dim)}
.beast .beast-stats{color:var(--gold-hi);font-weight:600;margin:1px 0 2px}
.beast.unmet{opacity:.55}
.b-fig{width:54px;height:54px;display:grid;place-items:center;border-radius:50%;background:#1f1612;color:var(--ink-dim);font:700 22px var(--ui)}
.setlist{display:grid;gap:2px;margin:0 0 16px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.setlab{display:grid;gap:1px;min-width:0}
.setlab b{font:700 16px/1.2 var(--ui);color:var(--ink)}
.setlab span{font:500 13.5px/1.3 var(--ui);color:var(--ink-dim)}
.toggle{flex:none;min-width:58px;min-height:34px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);font:700 13px var(--ui);cursor:pointer}
.toggle[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#22160f}
.setrow input[type=range]{flex:1;max-width:220px;accent-color:var(--gold)}
.pick{margin:0 0 10px;font:600 12px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.part-line{margin:-4px 0 10px;font:500 13.5px/1.4 var(--ui);color:var(--ink-dim)}
.battles + h3.pick{margin-top:18px}
.battles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.battle{
  display:grid;gap:5px;min-width:0;padding:0 0 10px;text-align:left;cursor:pointer;color:var(--ink);
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;overflow:hidden;
}
.battle:hover{border-color:var(--gold)}
.battle canvas{display:block;width:100%;height:62px;background:#4c5c54;border-bottom:1px solid var(--line)}
.battle .b-name{display:flex;align-items:baseline;gap:7px;padding:2px 10px 0;font:700 17px/1.15 var(--ui);min-width:0}
.battle .b-num{font:700 13px/1 var(--ui);color:var(--gold);font-variant-numeric:tabular-nums lining-nums}
.battle .b-won{margin-left:auto;align-self:center;font:700 10px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:999px;background:var(--gold);color:#22160f}
.battle .b-meta{padding:0 10px;font:500 13px/1.25 var(--ui);color:var(--ink-dim)}
.hint .hk{color:var(--gold-hi);font-weight:700;margin-right:6px}
.next{gap:7px}
.next canvas{display:block;height:28px;width:120px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.unit{
  position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:5;width:min(380px, calc(100% - 24px));
  display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:center;padding:10px 12px 12px;border-radius:10px;
  background:rgba(28,19,15,.96);box-shadow:0 0 0 1px var(--line), inset 0 0 0 4px rgba(28,19,15,.96), inset 0 0 0 5px rgba(212,165,55,.32), 0 10px 24px rgba(0,0,0,.45);
}
.unit canvas{grid-row:1 / span 2;width:46px;height:46px}
.unit .u-name{align-self:end;font:700 18px/1.1 var(--ui)}
.unit .u-stats{align-self:start;font:600 13px/1.25 var(--ui);color:var(--ink-dim);font-variant-numeric:tabular-nums lining-nums}
.unit .u-desc{grid-column:1 / -1;margin:4px 0 0;font:500 14px/1.35 var(--ui);color:var(--ink)}
.unit .btnrow{grid-column:1 / -1;margin-top:8px}
.unit .primary,.unit .secondary{min-height:40px;font-size:14px;padding:0 14px}
.unit .u-paths{grid-column:1 / -1;display:grid;gap:6px;margin-top:8px}
.path{display:grid;gap:2px;text-align:left;padding:9px 11px;border-radius:8px;cursor:pointer;color:var(--ink);background:var(--panel-2);border:1px solid var(--line)}
.path:hover:not(:disabled){border-color:var(--gold)}
.path:disabled{opacity:.45;cursor:not-allowed}
.path b{font:700 15px/1.15 var(--ui);color:var(--gold-hi)}
.path span{font:500 13px/1.3 var(--ui);color:var(--ink-dim)}
.party{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 14px}
.regular{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;padding:7px 10px 8px 6px;border-radius:8px;cursor:pointer;color:var(--ink);background:var(--panel-2);border:1px solid var(--line)}
.regular canvas{grid-row:1 / span 2;width:40px;height:40px}
.regular b{font:700 15px/1.1 var(--ui)}
.regular span{font:500 12.5px/1.3 var(--ui);color:var(--ink-dim)}
.regular[aria-pressed="true"]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.regular[aria-pressed="false"]{opacity:.62}
.regwrap{position:relative;display:grid}
.regwrap.looks .regular{padding-right:48px}
.look{position:absolute;top:7px;right:7px;min-width:38px;padding:3px 7px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 11.5px/1 var(--ui);letter-spacing:.03em;cursor:pointer}
.look:hover,.look:focus-visible{border-color:var(--gold);color:var(--gold-hi)}
.diff{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.diff button{font:700 13px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;min-height:36px;padding:0 12px;border-radius:7px;cursor:pointer;color:var(--ink);background:transparent;border:1px solid var(--line)}
.diff button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#22160f}
.diff-line{margin:0 0 14px;font:500 14px/1.35 var(--ui);color:var(--ink-dim)}
.count{font:600 12px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-left:8px}
.credits p{margin:0 0 12px;font:500 15px/1.4 var(--ui);color:var(--ink)}
.credits .legal{font-size:13px;color:var(--ink-dim)}
.credits a{color:var(--gold-hi)}
.persona{margin:0 0 16px;font:500 16px/1.35 var(--ui);color:var(--ink)}
.persona span{color:var(--gold-hi);font-weight:700}
.tally{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0 0 18px}
.tally div{display:flex;flex-direction:column;gap:3px}
.tally b{font:700 24px/1 var(--ui);font-variant-numeric:tabular-nums lining-nums}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.primary,.secondary{
  font:700 15px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;border-radius:7px;padding:0 18px;min-height:44px;cursor:pointer;
}
.primary{color:var(--ink);background:var(--red);border:1px solid var(--gold)}
.primary:hover{background:var(--red-hi)}
.secondary{color:var(--ink);background:transparent;border:1px solid var(--line)}
.secondary:hover{background:var(--panel-2)}
.toast{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);
  padding:9px 16px 10px;text-align:center;pointer-events:none;border-radius:8px;
  background:rgba(28,19,15,.93);box-shadow:0 0 0 1px var(--line), 0 8px 20px rgba(0,0,0,.4);
  transition:opacity .35s ease, transform .35s ease;
}
.toast .t-title{display:block;margin:3px 0 2px;font:800 26px/1 var(--display);color:var(--ink)}
.toast .t-line{display:block;font:500 14px/1.3 var(--ui);color:var(--ink-dim)}
.toast.out{opacity:0;transform:translate(-50%,-6px)}
.hint{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);
  padding:7px 12px;border-radius:14px;pointer-events:none;text-align:center;
  font:600 14px/1.2 var(--ui);color:var(--ink);background:rgba(28,19,15,.92);box-shadow:0 0 0 1px var(--line);
  transition:opacity .3s ease;
}
.hint.out{opacity:0}
@media (max-width:520px){
  h1{font-size:25px}
  .battles{grid-template-columns:1fr}
  .rooms,.rooms.modes{grid-template-columns:1fr}
  .room{min-height:0}
  .trophies,.beasts,.items{grid-template-columns:1fr}
  .party.fixed{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pw b{display:none}
  .pw.th b{display:inline;font-size:11px}
  .party{grid-template-columns:1fr}
  .panel h2{font-size:38px}
  .ctl{padding:0 9px}
  .tray{gap:4px}
  .card canvas{width:32px;height:32px}
  .card .nm{display:none}
  .card .meta{font-size:12px;gap:2px}
  .card .meta .coin{width:9px;height:9px}
  .card .role,.card .key{display:none}
  .stat b{font-size:17px}
  .hud{gap:6px 12px;padding:5px 10px}
  .next .lbl{display:none}
}
@media (max-height:520px) and (orientation:landscape){
  .app{gap:6px;padding-block:6px 8px}
  h1{font-size:22px}
  .card canvas{width:34px;height:34px}
  .card .role{display:none}
}
@media (prefers-reduced-motion:reduce){
  #purse.pulse b{animation:none}
  .toast,.hint{transition:none}
}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <span class="eyebrow" id="battleEye">Mitz &amp; Simz</span>
      <h1>Hold the Line</h1>
    </div>
    <div class="controls">
      <button class="ctl" id="btnPause" type="button">Pause</button>
      <button class="ctl" id="btnSpeed" type="button" aria-label="Game speed">1×</button>
      <button class="ctl" id="btnDice" type="button" aria-pressed="true" aria-label="Show dice rolls">Dice</button>
      <button class="ctl" id="btnAuto" type="button" aria-pressed="false" aria-label="Let Simz place heroes">Auto</button>
    </div>
  </header>

  <section class="hud" aria-label="Game status">
    <div class="stat" id="purse"><span class="coin" aria-hidden="true"></span><b id="gold">150</b><span class="lbl">Gold</span></div>
    <div class="stat"><span class="lbl">Tavern</span><span class="pips" id="lives" aria-label="Tavern lives"></span></div>
    <div class="stat"><span class="lbl" id="waveLbl">Wave</span><b id="wave">–</b></div>
    <div class="stat next" id="next" hidden><span class="lbl" id="nextLbl">Next wave</span><canvas id="nextStrip" aria-hidden="true"></canvas><span class="sr" id="nextText" aria-live="polite"></span></div>
    <div class="stat cats" id="cats" hidden>
      <button class="pw" id="pw-pounce" type="button" aria-pressed="false" title="Mitz’s Pounce (Q): stuns every monster in a 3 × 3 square for a round"><svg class="paw" viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="10" cy="13.4" rx="5" ry="4.2"/><ellipse cx="3.6" cy="8.2" rx="1.9" ry="2.4"/><ellipse cx="7.6" cy="4.6" rx="2" ry="2.5"/><ellipse cx="12.4" cy="4.6" rx="2" ry="2.5"/><ellipse cx="16.4" cy="8.2" rx="1.9" ry="2.4"/></svg><b>Pounce</b><span class="pw-cd" id="cd-pounce"></span></button>
      <button class="pw" id="pw-swat" type="button" aria-pressed="false" title="Simz’s Swat (W): knocks a monster that is not a boss off the table"><svg class="paw" viewBox="0 0 20 20" aria-hidden="true"><ellipse cx="10" cy="13.4" rx="5" ry="4.2"/><ellipse cx="3.6" cy="8.2" rx="1.9" ry="2.4"/><ellipse cx="7.6" cy="4.6" rx="2" ry="2.5"/><ellipse cx="12.4" cy="4.6" rx="2" ry="2.5"/><ellipse cx="16.4" cy="8.2" rx="1.9" ry="2.4"/></svg><b>Swat</b><span class="pw-cd" id="cd-swat"></span></button>
    </div>
    <div class="stat cats" id="belt" hidden aria-label="The belt"></div>
    <div class="stat cats" id="gatebox" hidden>
      <button class="pw" id="btnGate" type="button" title="The yard gate (G): shut its way round for a few rounds, once a battle"><svg class="paw" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="3" width="2.4" height="15" rx="1"/><rect x="15.6" y="3" width="2.4" height="15" rx="1"/><rect x="5.6" y="6" width="1.6" height="11"/><rect x="9.2" y="6" width="1.6" height="11"/><rect x="12.8" y="6" width="1.6" height="11"/><rect x="4" y="6.5" width="12" height="1.6"/><rect x="4" y="13" width="12" height="1.6"/></svg><b>Gate</b><span class="pw-cd" id="cd-gate"></span></button>
    </div>
    <canvas class="track" id="track" aria-label="Initiative track for the current round"></canvas>
  </section>

  <main class="board" id="boardWrap">
    <canvas id="board" aria-label="Battle mat"></canvas>
    <div class="toast" id="toast" hidden><span class="eyebrow t-eye"></span><span class="t-title"></span><span class="t-line"></span></div>
    <div class="hint" id="hint" hidden></div>
    <div class="unit" id="unitCard" role="dialog" aria-labelledby="uName" hidden>
      <canvas aria-hidden="true"></canvas>
      <b class="u-name" id="uName"></b>
      <span class="u-stats" id="uStats"></span>
      <p class="u-desc" id="uDesc"></p>
      <div class="btnrow" id="uButtons"><button class="primary" id="btnLevel" type="button"></button><button class="secondary" id="btnRecall" type="button"></button><button class="secondary" id="btnUnitClose" type="button">Close</button></div>
      <div class="u-paths" id="uPaths" hidden></div>
    </div>
    <div class="overlay" id="overlay"></div>
  </main>

  <nav class="tray" id="tray" aria-label="Heroes"></nav>
</div>

<script src="mitznsimz_minis.js"></script>
<script src="motion.js"></script>
<script src="sound.js"></script>
<script src="pack-core.js"></script>
<script src="sim.js"></script>
<script src="modes.js"></script>
<script src="campaign.js"></script>
<script src="game.js"></script>
</body>
</html>
